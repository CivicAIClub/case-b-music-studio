name: Deploy to GitHub Pages

# Publishes the "Music Studio has moved" page (pages-moved/index.html) to this repo's gh-pages
# branch. The app itself is now served by Google with Pomfret sign-in (see README, "Hosting on
# Google"), so this no longer builds the app and needs no secrets.
# Live at https://civicaiclub.github.io/case-b-music-studio/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stage the one static page. It is also 404.html, so any old link (including the app's
      # #/students style addresses) lands on it. Publishing replaces everything on gh-pages,
      # so the old app files are no longer served.
      - name: Stage the moved page
        run: |
          set -eu
          mkdir -p dist
          cp pages-moved/index.html dist/index.html
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          enable_jekyll: false
          commit_message: "deploy: ${{ github.sha }}"
