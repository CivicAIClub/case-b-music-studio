name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Runs apps-script/Code.gs in Node against pretend Google services (made-up data only).
      - name: Apps Script tests (tests/*.test.js)
        run: npm test
      - name: Type-check and build
        env:
          # Placeholders: the build only needs the variables to exist.
          VITE_APPS_SCRIPT_BASE_URL: https://script.google.com/macros/s/PLACEHOLDER/exec
          VITE_APPS_SCRIPT_SHARED_SECRET: placeholder-not-a-real-secret
        run: npm run build
