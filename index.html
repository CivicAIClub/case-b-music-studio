<!doctype html>
<!--
  The whole GitHub Pages site after the handoff: one static page saying the Music Studio has
  moved. It holds no link to the new site, no data and no secret, and loads nothing else.
  Published by .github/workflows/deploy-pages.yml (also as 404.html, so old links land here).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Music Studio has moved</title>
    <style>
      :root {
        --bg: #f6f1ec;
        --surface: #ffffff;
        --text: #1a1411;
        --muted: #6b6157;
        --accent: #7a142f;
        --border: #ece4dd;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.5;
      }
      header {
        background: var(--accent);
        color: #ffffff;
        padding: 18px 24px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.3rem;
        font-weight: 600;
      }
      main {
        max-width: 560px;
        margin: 48px auto;
        padding: 0 16px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 28px;
      }
      h1 {
        margin: 0 0 12px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.8rem;
      }
      p { margin: 0 0 10px; font-size: 1.05rem; }
      .muted { color: var(--muted); font-size: 0.9rem; margin: 0; }
    </style>
  </head>
  <body>
    <header>Pomfret School · Music Studio</header>
    <main>
      <div class="card">
        <h1>The Music Studio has moved</h1>
        <p>The Music Studio has moved to a Pomfret-only Google link. Ask Mr. O'Neal for it.</p>
        <p class="muted">Sign in with your Pomfret Google account to use it.</p>
      </div>
    </main>
  </body>
</html>
